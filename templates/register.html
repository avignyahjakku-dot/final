{% extends "base.html" %}

{% block title %}Student Registration{% endblock %}

{% block content %}
<div style="max-width: 520px; margin: 2rem auto;">
  <div class="form-card">
    <div style="text-align:center; margin-bottom: 1.75rem;">
      <h2 style="font-size: 1.75rem; font-weight: 800; color: var(--text-main);">Create Student Account</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Join the campus Lost &amp; Found network</p>
    </div>

    <form action="{{ url_for('register') }}" method="POST" id="register-form">
      <div class="form-group">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Aarav Sharma" required>
      </div>

      <div class="form-group">
        <label for="student_id" class="form-label">Student ID / Roll Number</label>
        <input type="text" id="student_id" name="student_id" class="form-control" placeholder="e.g. 23BCSE101" required>
        <div class="form-help">Enter your official college-issued registration number.</div>
      </div>

      <div class="form-group">
        <label for="email" class="form-label">College Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="e.g. student@campus.edu" required>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="At least 6 characters" minlength="6" required>
      </div>

      <div class="form-group">
        <label for="confirm_password" class="form-label">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-type your password" required>
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1rem;">
        Register Account
      </button>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
        Already have an account? <a href="{{ url_for('login') }}" style="font-weight: 600;">Log In</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
